steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # Step 2: Run Tests (if applicable in the future)
  # - name: 'node:20'
    # entrypoint: 'npm'
    # args: ['test']

  # Step 3: Build the Docker image for the API
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/pitchy-api:$COMMIT_SHA',
      '-f', 'apps/api/Dockerfile',
      '.'
    ]

  # Step 4: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pitchy-api:$COMMIT_SHA']

  # Step 5: Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pitchy-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pitchy-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Example of mounting a secret for Firebase/Gemini
      # - '--set-secrets=GEMINI_API_KEY=gemini-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/pitchy-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
